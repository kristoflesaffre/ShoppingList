<title>ShoppingList Canvas</title>
<style>
/* Layout: full-bleed infinite board (pan + zoom) with a floating toolbar; boards get added top-left in «werk». */
:root {
  /* ShoppingList DS tokens (styles/tokens.css, Stijl 1 · Helder) */
  --gray-25:#f8f8f9; --gray-50:#f1f1f3; --gray-100:#e2e4e6; --gray-200:#c6c8ce; --gray-300:#a9adb5;
  --gray-400:#6e7381; --gray-500:#707784; --gray-600:#595f6a; --gray-700:#43474f; --gray-800:#2d2f35; --gray-900:#16181a;
  --white:#ffffff;
  --blue-25:#f6f6fe; --blue-50:#edeefe; --blue-100:#dcddfc; --blue-200:#b9bbf9; --blue-300:#9599f7; --blue-400:#7277f4;
  --blue-500:#4f55f1; --blue-600:#3f44c1; --blue-700:#2f3391; --blue-800:#202260; --blue-900:#101130;
  --secondary-100:#fcedde; --secondary-500:#f2a65a; --secondary-600:#c28548;
  --error-25:#fff6f5; --error-600:#b92028;
  --bg-app:#f5f6fa; --card-hairline:#e6e8f0;
  --text-primary:var(--gray-900); --text-secondary:var(--gray-600); --text-tertiary:var(--gray-500);
  --action-primary:var(--blue-500); --border-default:var(--gray-200);
  --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --radius-md:8px; --radius-lg:16px; --radius-pill:256px;
  --shadow-card:0 0 0 1px var(--card-hairline), 0 1px 2px rgba(16,17,48,.04);
  --shadow-raised:0 2px 4px rgba(16,17,48,.06), 0 10px 24px -6px rgba(16,17,48,.14);
  /* canvas chrome */
  --board-bg:#eceef4; --dot:#c9ccd8; --toolbar:var(--white);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --gray-50:#151827; --gray-100:#272b42; --gray-200:#3a3f5c; --gray-500:#b3b7cf; --gray-600:#c6c9dc; --gray-900:#eef0fb;
  --white:#1a1d2e; --blue-50:#24284a; --blue-500:#a9acff; --bg-app:#10121f; --card-hairline:#272b42;
  --board-bg:#0d0f1a; --dot:#2a2e46; color-scheme:dark;
} }
:root[data-theme="dark"] {
  --gray-50:#151827; --gray-100:#272b42; --gray-200:#3a3f5c; --gray-500:#b3b7cf; --gray-600:#c6c9dc; --gray-900:#eef0fb;
  --white:#1a1d2e; --blue-50:#24284a; --blue-500:#a9acff; --bg-app:#10121f; --card-hairline:#272b42;
  --board-bg:#0d0f1a; --dot:#2a2e46; color-scheme:dark;
}
html, body { height:100%; }
body { margin:0; background:var(--board-bg); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
#viewport { position:fixed; inset:0; cursor:grab; touch-action:none;
  background-image:radial-gradient(var(--dot) 1px, transparent 1px); }
#viewport.panning { cursor:grabbing; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
.toolbar { position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  display:flex; align-items:center; gap:4px; padding:4px; border-radius:var(--radius-pill);
  background:var(--toolbar); box-shadow:var(--shadow-raised); font-size:13px; }
.toolbar button { border:0; background:transparent; color:var(--text-primary); font:inherit;
  height:32px; min-width:32px; padding:0 12px; border-radius:var(--radius-pill); cursor:pointer; }
.toolbar button:hover { background:var(--blue-50); }
.toolbar button:focus-visible { outline:2px solid var(--action-primary); outline-offset:1px; }
.toolbar .zoom { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--text-secondary); min-width:52px; text-align:center; }
.page-tag { position:fixed; left:16px; top:calc(16px + env(safe-area-inset-top, 0px));
  padding:6px 12px; border-radius:var(--radius-pill); background:var(--toolbar); box-shadow:var(--shadow-card);
  font-size:12px; font-weight:600; color:var(--text-secondary); letter-spacing:.02em; }
.page-tag b { color:var(--action-primary); font-weight:600; }

/* ===== Mockup-styling (ShoppingList DS) ===== */
.board { position:absolute; display:flex; flex-direction:column; gap:28px; }
.board.intro h1 { margin:0 0 8px; font-size:44px; letter-spacing:-.02em; }
.board.intro p { margin:0; max-width:900px; font-size:18px; line-height:1.5; color:var(--text-secondary); }
.bhd { display:flex; gap:20px; align-items:flex-start; }
.bnum { flex:none; width:56px; height:56px; border-radius:18px; background:var(--action-primary); color:#fff; font-size:28px; font-weight:800; display:grid; place-items:center; }
.bhd h2 { margin:2px 0 6px; font-size:30px; letter-spacing:-.01em; }
.bhd p { margin:0; max-width:1100px; font-size:16px; line-height:1.5; color:var(--text-secondary); }
.bhd .uses { margin-top:6px; font-size:13px; font-weight:600; color:var(--action-primary); }
.frames { display:flex; gap:48px; align-items:flex-start; }
.fr { margin:0; display:flex; flex-direction:column; gap:10px; }
.fr figcaption { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); }
.phone { width:390px; height:844px; border-radius:54px; background:#111; padding:10px; box-shadow:0 30px 60px -30px rgba(16,17,48,.5); position:relative; }
.notch { position:absolute; top:18px; left:50%; transform:translateX(-50%); width:110px; height:30px; border-radius:20px; background:#111; z-index:5; }
.pscreen { --s:#fff; width:100%; height:100%; border-radius:44px; overflow:hidden; background:rgba(16,17,48,.42); position:relative; display:flex; flex-direction:column; padding-top:54px; color:#16181a; }
.pscreen > * { background:#fff; }
.pscreen > .grab { border-radius:26px 26px 0 0; }
.desk { width:1180px; height:900px; border-radius:16px; overflow:hidden; background:#f5f6fa; box-shadow:0 30px 60px -30px rgba(16,17,48,.4), 0 0 0 1px var(--card-hairline); display:flex; flex-direction:column; color:#16181a; }
.dbar { height:36px; flex:none; display:flex; align-items:center; gap:7px; padding:0 14px; background:#eceef4; font-size:12px; color:#707784; }
.dbar i { width:11px; height:11px; border-radius:50%; background:#d5d8e1; }
.dbar span { margin-left:14px; }
.dstage { flex:1; background:rgba(16,17,48,.42); display:grid; place-items:center; padding:28px; }
.dlg { background:#fff; border-radius:26px; max-height:820px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px -20px rgba(16,17,48,.5); }
/* sheet chrome */
.grab { display:block; height:22px; position:relative; flex:none; }
.grab::after { content:""; position:absolute; left:50%; top:9px; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:#e2e4e6; }
.shead, .dhead { display:flex; align-items:center; gap:12px; padding:4px 20px 12px; flex:none; }
.dhead { padding:26px 32px 14px; }
.shead h3, .dhead h3 { margin:0; flex:1; font-size:22px; font-weight:800; letter-spacing:-.01em; }
.dhead h3 { font-size:26px; }
.xbtn { width:36px; height:36px; border-radius:50%; background:#f1f1f3; color:#43474f; display:grid; place-items:center; flex:none; }
.xbtn svg { width:18px; height:18px; }
.sbody { flex:1; overflow:hidden; padding:4px 20px 16px; display:flex; flex-direction:column; gap:14px; }
.dbody { flex:1; overflow:hidden; padding:6px 32px 24px; display:flex; flex-direction:column; gap:16px; }
.sfoot { flex:none; display:flex; gap:10px; justify-content:flex-end; padding:14px 20px calc(14px + 18px); border-top:1px solid #eef0f4; }
.dlg .sfoot { padding:16px 32px; }
.phone .sfoot .btn { flex:1; }
/* Mobiel: geen «Annuleer» — het kruisje rechtsboven sluit het blad al. */
.phone .sfoot .btn.sec { display:none; }
/* Mobiel: de knop is sticky — hij zweeft onderaan en de lijst scrolt eronder door (zachte fade). */
.pscreen > .sfoot { position:absolute; left:0; right:0; bottom:0; border-top:0; padding-top:28px; background:linear-gradient(180deg, rgba(255,255,255,0) 0, #fff 26px); z-index:3; }
.pscreen > .sbody { padding-bottom:0; }
.pscreen > .sfoot .btn.pri { box-shadow:0 10px 24px -10px rgba(79,85,241,.7); }
.lbl { margin:0; font-size:11.5px; font-weight:800; letter-spacing:.06em; color:#707784; display:flex; align-items:center; gap:6px; }
.lbl svg, .lbl .mask { width:14px; height:14px; }
.lbl.row { justify-content:space-between; }
.lnk { color:var(--action-primary); font-weight:700; letter-spacing:0; font-size:13px; display:inline-flex; align-items:center; gap:3px; text-transform:none; }
.lnk svg { width:14px; height:14px; }
/* controls */
.search { height:48px; border-radius:16px; background:#f8f8f9; display:flex; align-items:center; gap:10px; padding:0 14px; font-size:15px; flex:none; }
.search svg { width:20px; height:20px; color:#707784; flex:none; }
.search .ph { color:#707784; }
.search .val { color:#16181a; }
.search.grow { flex:1; }
.seg { display:flex; gap:2px; padding:3px; border-radius:13px; background:#f1f1f3; flex:none; }
.seg span { height:32px; padding:0 14px; display:grid; place-items:center; border-radius:10px; font-size:13.5px; font-weight:600; color:#595f6a; }
.seg span.on { background:#fff; color:#16181a; box-shadow:0 1px 3px rgba(16,17,48,.12); }
/* Mobiel: segmentknop over de volle breedte, elke optie 1/3 (zoals SegmentedControl fill in de app). */
.pscreen .seg span { flex:1 1 0; min-width:0; padding:0 6px; }
.row2 { display:flex; gap:12px; align-items:center; }
.chips { display:flex; gap:6px; flex-wrap:nowrap; overflow:hidden; flex:none; }
.chip { height:30px; padding:0 12px; border-radius:999px; background:#f1f1f3; color:#43474f; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.chip.on { background:var(--action-primary); color:#fff; }
.chip i { width:8px; height:8px; border-radius:50%; }
.btn { height:50px; border-radius:999px; padding:0 22px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:16px; font-weight:700; white-space:nowrap; }
.btn.md { height:42px; font-size:15px; padding:0 18px; }
.btn.sm { height:34px; font-size:13.5px; padding:0 14px; }
.btn.pri { background:var(--action-primary); color:#fff; }
.btn.sec { background:#edeefe; color:var(--action-primary); }
.dlg .btn { height:42px; font-size:15px; }
.btn .cnt { min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#fff; color:var(--action-primary); font-size:12.5px; font-weight:800; display:grid; place-items:center; }
.stepper { display:inline-flex; align-items:center; height:34px; border-radius:999px; background:var(--action-primary); color:#fff; flex:none; }
.stepper b { width:32px; height:34px; display:grid; place-items:center; }
.stepper b svg { width:14px; height:14px; }
.stepper i { font-style:normal; font-weight:800; font-size:14px; min-width:14px; text-align:center; }
.stepper.sm { height:28px; } .stepper.sm b { width:26px; height:28px; } .stepper.sm b svg { width:12px; height:12px; }
.plusbtn { border-radius:50%; background:#edeefe; color:var(--action-primary); display:grid; place-items:center; flex:none; }
.plusbtn svg { width:55%; height:55%; }
.mask { display:inline-block; width:20px; height:20px; background:var(--action-primary); -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; flex:none; }
.mask.snow { -webkit-mask-image:var(--snow); mask-image:var(--snow); }
.mask.jar { -webkit-mask-image:var(--jar); mask-image:var(--jar); }
.ic { width:32px; height:32px; display:grid; place-items:center; border-radius:50%; flex:none; }
.pimg { object-fit:contain; flex:none; mix-blend-mode:multiply; }
.hscroll { margin:-6px -20px -18px; padding:6px 20px 18px; overflow:hidden; flex:none; }
.kbd { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 5px; border-radius:6px; background:#f1f1f3; box-shadow:inset 0 -1px 0 #d9dce5; font-size:12px; font-weight:700; color:#43474f; }
/* plates */
.plate { position:relative; display:inline-block; flex:none; }
.plate .bord { position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 6px 10px rgba(16,17,48,.16)); }
.plate img:not(.bord) { position:absolute; left:50%; top:50%; object-fit:contain; filter:drop-shadow(0 3px 4px rgba(16,17,48,.16)); }
.plate .on0 { transform:translate(-50%,-50%) translate(-20%,-12%) rotate(-10deg); }
.plate .on1 { transform:translate(-50%,-50%) translate(21%,-9%) rotate(9deg); }
.plate .on2 { transform:translate(-50%,-50%) translate(0,17%) rotate(-3deg); }
.eplate { display:inline-block; border-radius:50%; border:1.5px dashed #b9bbf9; background:#f6f6fe; flex:none; }
/* 1 weekstrip */
.wstrip { display:flex; gap:8px; }
.wday { box-sizing:border-box; flex:none; width:68px; height:118px; border-radius:16px; background:#f8f8f9; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:10px; gap:4px; }
.wday em { font-style:normal; font-size:10.5px; font-weight:800; color:#707784; letter-spacing:.04em; }
.wday b { font-size:18px; font-weight:800; line-height:20px; }
.wday .dish { width:46px; height:46px; border-radius:50%; object-fit:cover; margin-top:4px; }
.wday .plate, .wday .eplate { margin-top:4px; }
.wday.on { background:#fff; box-shadow:0 0 0 2px var(--action-primary), 0 10px 22px -12px rgba(79,85,241,.6); }
.wday.on em, .wday.on b { color:var(--action-primary); }
.wday.geen { justify-content:center; padding:0 4px; text-align:center; color:#595f6a; }
.wday.geen svg { width:22px; height:22px; }
.wday.geen b { font-size:12.5px; line-height:15px; color:#16181a; }
.wday.geen em { font-size:10.5px; letter-spacing:0; font-weight:600; }
.dlg .wstrip { justify-content:space-between; } .dlg .wday { width:96px; height:124px; }
.fgrid { display:grid; gap:8px; }
.fgrid.c3 { grid-template-columns:repeat(3,1fr); } .fgrid.c6 { grid-template-columns:repeat(6,1fr); }
.ftile { position:relative; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #e6e8f0; padding:12px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; min-height:118px; }
.ftile b { font-size:12.5px; font-weight:700; } .ftile em { font-style:normal; font-size:11px; color:#707784; }
.ftile.sel { background:#f6f6fe; box-shadow:inset 0 0 0 2px var(--action-primary); }
.fplus { position:absolute; top:6px; right:6px; }
/* 2 mandje */
.rlist, .blist { display:flex; flex-direction:column; }
.rrow { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid #eef0f4; }
.rrow:first-child { border-top:0; }
.rtxt { flex:1; min-width:0; display:flex; flex-direction:column; line-height:18px; }
.rtxt b { font-size:15px; font-weight:600; } .rtxt b u { text-decoration:none; font-weight:400; color:#595f6a; }
.rtxt em { font-style:normal; font-size:12.5px; color:#707784; display:flex; align-items:center; gap:4px; }
.jarl { color:var(--action-primary); font-weight:600; display:inline-flex; gap:4px; align-items:center; } .jarl .mask { width:14px; height:14px; }
.pad-tray { padding-bottom:90px; }
.pscreen > .tray { position:absolute; left:14px; right:14px; bottom:30px; height:64px; border-radius:22px; background:#fff; box-shadow:0 14px 30px -12px rgba(16,17,48,.6), 0 0 0 1px #eef0f4; display:flex; align-items:center; gap:10px; padding:0 10px 0 12px; }
.tthumbs { display:flex; } .tthumbs .pimg { width:34px!important; height:34px!important; border-radius:50%; background:#f6f6fe; padding:3px; margin-left:-10px; box-shadow:0 0 0 2px #fff; mix-blend-mode:normal; }
.tthumbs .pimg:first-child { margin-left:0; }
.ttxt { flex:1; display:flex; flex-direction:column; line-height:17px; } .ttxt b { font-size:14.5px; } .ttxt em.plain { color:#707784; font-weight:500; }
.ttxt em { font-style:normal; font-size:12.5px; color:var(--action-primary); font-weight:600; display:flex; align-items:center; } .ttxt em svg { width:14px; height:14px; }
.split { flex:1; display:grid; grid-template-columns:1fr 360px; min-height:0; border-top:1px solid #eef0f4; }
.split.even { grid-template-columns:1fr 1fr; }
.split.side { grid-template-columns:240px 1fr; }
.sl { padding:20px 28px; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
.sl.center { align-items:center; justify-content:center; background:linear-gradient(180deg,#f6f6fe,#fff); gap:22px; }
.sr { padding:20px 24px; background:#f8f8f9; display:flex; flex-direction:column; gap:14px; border-left:1px solid #eef0f4; }
.sr.plain { background:#fff; }
.dayhd { display:flex; align-items:center; gap:12px; } .dayhd > span:last-child { display:flex; flex-direction:column; line-height:20px; } .dayhd b { font-size:16px; }
.datetile { width:44px; height:48px; border-radius:12px; background:#fff; box-shadow:0 1px 3px rgba(16,17,48,.1); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:16px; }
.datetile em { font-style:normal; font-size:10px; font-weight:800; color:var(--action-primary); } .datetile b { font-size:18px; }
.platewrap { display:grid; place-items:center; padding:6px 0; }
.blist .rrow { background:#fff; border-radius:14px; padding:8px 10px; border:0; margin-bottom:6px; }
/* 3 bord */
.dayline .chips { overflow:hidden; }
.bigplate { display:flex; flex-direction:column; align-items:center; gap:14px; padding:6px 0 2px; }
.slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; }
.slots.row { max-width:470px; }
.slot { border-radius:16px; border:1.5px dashed #b9bbf9; background:#f6f6fe; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
.slot .sph { width:46px; height:46px; border-radius:50%; background:#fff; color:var(--action-primary); display:grid; place-items:center; margin-bottom:4px; }
.slot .sph svg { width:20px; height:20px; }
.slot b { font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#707784; }
.slot em { font-style:normal; font-size:13px; font-weight:600; }
.slot.fill { border:0; background:#fff; box-shadow:inset 0 0 0 1px #e6e8f0; }
.slot.fill .sph { background:#f8f8f9; }
.suggs { display:flex; gap:8px; overflow:hidden; } .suggs.wrap { flex-wrap:wrap; }
.sugg { height:40px; padding:0 14px 0 6px; border-radius:999px; background:#f8f8f9; display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; white-space:nowrap; }
.sugg.on { background:#edeefe; box-shadow:inset 0 0 0 1.5px var(--action-primary); color:var(--action-primary); }
.sugg i { width:18px; height:18px; border-radius:50%; background:var(--action-primary); color:#fff; display:grid; place-items:center; } .sugg i svg { width:12px; height:12px; }
.hint { margin:0; font-size:13.5px; color:#707784; text-align:center; max-width:360px; }
/* 4 categorieën */
.dpill { height:40px; padding:0 14px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px #e6e8f0; display:inline-flex; align-items:center; gap:8px; font-size:14px; color:#43474f; align-self:flex-start; flex:none; }
.dpill svg { width:18px; height:18px; color:var(--action-primary); } .dpill b { color:#16181a; }
.dpill.sm { height:32px; font-size:13px; padding:0 10px; }
.dhead .dpill { margin-right:8px; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ccard { position:relative; height:118px; border-radius:20px; padding:12px 14px; overflow:hidden; background:linear-gradient(160deg, color-mix(in srgb, var(--c) 18%, #fff), color-mix(in srgb, var(--c) 5%, #fff)); display:flex; flex-direction:column; justify-content:flex-end; }
.ccard b { font-size:14px; line-height:17px; position:relative; } .ccard em { font-style:normal; font-size:12px; color:#595f6a; position:relative; }
.cfan { position:absolute; top:8px; right:8px; display:flex; }
.cfan img { width:44px; height:44px; object-fit:contain; margin-left:-14px; filter:drop-shadow(0 3px 4px rgba(16,17,48,.15)); }
.cfan img:nth-child(1) { transform:rotate(-10deg); } .cfan img:nth-child(3) { transform:rotate(10deg); }
.cnav { padding:18px 14px; background:#f8f8f9; border-right:1px solid #eef0f4; display:flex; flex-direction:column; gap:2px; }
.cnav .search { margin-bottom:10px; height:42px; background:#fff; box-shadow:inset 0 0 0 1px #e6e8f0; }
.cn { height:38px; padding:0 10px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:#43474f; }
.cn i { width:9px; height:9px; border-radius:50%; flex:none; } .cn i.hrt { width:16px; height:16px; color:#e05a7a; background:none!important; } .cn i.hrt svg { width:16px; height:16px; }
.cn .mask { width:16px; height:16px; }

<div id="viewport">
  <div id="world">
    <!-- Boards go here. New boards: top-left, stacked upward. -->

      <strong>Lege canvas</strong>
      Hier komen nieuwe ontwerpborden voor ShoppingList. Sleep om te verschuiven, scroll of knijp om te zoomen.
    </div>

<div class="toolbar" role="toolbar" aria-label="Zoom">
  <button id="zoom-out" aria-label="Uitzoomen">−</button>
  <span class="zoom" id="zoom-label">100%</span>
  <button id="zoom-in" aria-label="Inzoomen">+</button>
  <button id="zoom-reset">Passend</button>
</div>

<!--ASSETS-->
<script>
(() => {
  const vp = document.getElementById('viewport'), world = document.getElementById('world'), label = document.getElementById('zoom-label');
  let x = 0, y = 0, s = 1;
  const apply = () => {
    world.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    const g = 24 * s; vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${x}px ${y}px`;
    label.textContent = Math.round(s * 100) + '%';
  };
  const zoomAt = (f, cx, cy) => { const n = Math.min(4, Math.max(0.05, s * f)); x = cx - (cx - x) * n / s; y = cy - (cy - y) * n / s; s = n; apply(); };
  const fit = () => {
    const kids = [...world.children]; if (!kids.length) { x = 80; y = 80; s = 1; return apply(); }
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    kids.forEach(k => { a = Math.min(a, k.offsetLeft); b = Math.min(b, k.offsetTop); c = Math.max(c, k.offsetLeft + k.offsetWidth); d = Math.max(d, k.offsetTop + k.offsetHeight); });
    const w = innerWidth, h = innerHeight, pad = 80;
    // Passend in de breedte, bovenaan beginnen (scroll om verder te kijken).
    s = Math.min(1, (w - pad * 2) / (c - a));
    x = (w - (c - a) * s) / 2 - a * s; y = pad - b * s; apply();
  };
  vp.addEventListener('wheel', e => { e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { x -= e.deltaX; y -= e.deltaY; apply(); } }, { passive: false });
  const pts = new Map(); let last = null;
  vp.addEventListener('pointerdown', e => { vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); vp.classList.add('panning'); last = null; });
  vp.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
    if (pts.size === 2) { const [p, q] = [...pts.values()]; const dist = Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY);
      if (last) zoomAt(dist / last, (p.clientX + q.clientX) / 2, (p.clientY + q.clientY) / 2); last = dist; }
    else { x += e.clientX - prev.clientX; y += e.clientY - prev.clientY; apply(); } });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) vp.classList.remove('panning'); };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  document.getElementById('zoom-in').onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
  document.getElementById('zoom-out').onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
  document.getElementById('zoom-reset').onclick = fit;
  fit();
})();
</script>
